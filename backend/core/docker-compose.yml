version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: standys_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: standys
    ports:
      - '5432:5432'
    volumes:
      - standys_data:/var/lib/postgresql/data
volumes:
  standys_data: